# =============================================================================
# 个人导航大屏与 Docker 代码库 Nginx 统一生产配置
# 宿主机: 甲骨文云 (129.146.122.202)
# 域名: https://jhsweetheart.com (一级主域名)
# =============================================================================

# HTTP 80 强制重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jhsweetheart.com www.jhsweetheart.com;
    return 301 https://$host$request_uri;
}

# HTTPS 443 核心生产站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jhsweetheart.com www.jhsweetheart.com;

    # SSL 证书路径 (支持泛域名证书或主域名独立证书)
    ssl_certificate /etc/letsencrypt/live/jhsweetheart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jhsweetheart.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态根目录
    root /usr/share/nginx/html/startpage;
    index index.html;

    # 静态 SPA / SSG 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资产与自托管图标强缓存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 图标专用目录
    location /icons/ {
        alias /usr/share/nginx/html/startpage/icons/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Gzip 极速压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
