# ==============================================================================
# 服务名称: Sub-Store (高级订阅管理与转换工具)
# 部署方式: Docker Compose
# 架构说明: 适用于 Surge / Clash / Loon / QX 等主流代理客户端的订阅管理、节点转换与过滤平台
# ==============================================================================

services:
  sub-store:
    # 容器镜像: xream/sub-store 官方镜像 (国内拉取慢可用 docker.1ms.run/xream/sub-store:latest)
    image: xream/sub-store:latest
    
    # 容器名称
    container_name: sub-store
    
    # 重启策略: 容器意外退出或系统重启时始终自动重启
    restart: always
    
    # 端口映射: [宿主机端口:容器内端口]
    ports:
      # Sub-Store Web 控制台与订阅 API 端口 (宿主机 3002 映射容器内默认服务端口 3001)
      - "3002:3001"
      
    # 数据卷挂载: 持久化存储订阅配置、节点数据及缓存 [宿主机相对路径:容器内绝对路径]
    # 原 NAS 宿主机实际路径: /tmp/zfsv3/sata12/18332733294/data/docker/substore
    volumes:
      # 数据目录持久化 (包含 sub-store.db 与相关配置文件)
      - ./data:/opt/app/data
      
    # 环境变量配置
    environment:
      # 前端与后端通信的安全密钥路径 (防止未经授权的 API 访问，请妥善保管)
      - SUB_STORE_FRONTEND_BACKEND_PATH=/T3B9dgzBzdRbBF8Aqx7P
      # 系统时区
      - TZ=Asia/Shanghai
      - TIME_ZONE=Asia/Shanghai
      
    # 自定义容器启动命令: 确保数据目录存在并以指定路径启动 Node.js 服务
    command: >
      /bin/sh -c "mkdir -p /opt/app/data; cd /opt/app/data; SUB_STORE_DOCKER=true SUB_STORE_FRONTEND_PATH=/opt/app/frontend SUB_STORE_DATA_BASE_PATH=/opt/app/data node /opt/app/sub-store.bundle.js"
