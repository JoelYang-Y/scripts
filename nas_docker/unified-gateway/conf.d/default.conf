# Homelab Unified Gateway (NAS 10.0.0.3)
# Reverse proxy for all internal services under *.jhsweetheart.com

# 1. Sub-Store (sub.jhsweetheart.com)
server {
    listen 80;
    listen 443 ssl;
    server_name sub.jhsweetheart.com;

    ssl_certificate /etc/nginx/ssl/wildcard.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.key;

    client_max_body_size 0;

    location / {
        proxy_pass http://10.0.0.3:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /T3B9dgzBzdRbBF8Aqx7P/ {
        proxy_pass http://10.0.0.3:3002/T3B9dgzBzdRbBF8Aqx7P/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://10.0.0.3:3002/T3B9dgzBzdRbBF8Aqx7P/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

