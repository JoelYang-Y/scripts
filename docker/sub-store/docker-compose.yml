version: '3.8'
services:
  sub-store:
    image: xream/sub-store:latest
    container_name: sub-store
    restart: always
    network_mode: host
    environment:
      - SUB_STORE_FRONTEND_BACKEND_PATH=/T3B9dgzBzdRbBF8Aqx7P
      - SUB_STORE_DATA_BASE_PATH=/opt/app/data
    volumes:
      - /Volume1/docker/sub-store:/opt/app/data
