# 1. start.jhsweetheart.com -> 专属 Chrome 起始页 / 聚合导航 (标准 443 端口直连)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name start.jhsweetheart.com;

    ssl_certificate /etc/letsencrypt/live/start.jhsweetheart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/start.jhsweetheart.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/startpage;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. oracle.jhsweetheart.com -> Vaultwarden 密码库与 Docker 镜像加速 (443 端口)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oracle.jhsweetheart.com;

    ssl_certificate /usr/local/etc/fullchain.pem;
    ssl_certificate_key /usr/local/etc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 128M;

    location /v2/ {
        proxy_pass http://registry:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
    }

    location /notifications/hub {
        proxy_pass http://vaultwarden:3012;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications/hub/negotiate {
        proxy_pass http://vaultwarden:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://vaultwarden:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. HTTP 80 端口自动 301 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name start.jhsweetheart.com oracle.jhsweetheart.com;
    return 301 https://$host$request_uri;
}
